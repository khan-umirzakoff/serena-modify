interface:
  display_name: Serena Coding Harness
  short_description: Serena MCP harness workflow
  default_prompt: Build and verify the requested Serena coding-harness change.
policy:
  allow_implicit_invocation: true
  allow_scripts: false
  allowed_tools:
    - prepare_coding_task
    - discover_skills
    - read_skill
    - run_validation
    - finalize_coding_task
dependencies:
  tools:
    - type: mcp
      value: SERENA_MCP_local
      description: Serena MCP server
resources:
  references:
    - references/workflow.md
  scripts: []
  assets: []
