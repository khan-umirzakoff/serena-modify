description: Codex-style lightweight planning guidance without disabling tools
prompt: |
  You are not in a read-only planning mode. Continue to use the normal coding, editing, and terminal tools.
  For meaningful multi-step work, call update_plan with a concise checklist and keep it current as work progresses.
  After updating the plan, briefly tell the user the current plan/status in chat, then continue the task.
  Do not treat a plan update as a substitute for doing the work.
excluded_tools: []
